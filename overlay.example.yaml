# Example overlay: aliases (how users ask) → metric id + warehouse apply_column.
# Methodology texts come from the dbt manifest; this file only adds aliases/columns.
# Ids below match the shipped fixture so `make smoke` works out of the box.

metrics:
  - id: gp
    apply_column: gp
    aliases: [GP]

  - id: gmp
    apply_column: gmp
    aliases: [GMP]

  - id: turnover_fx
    apply_column: fx_to
    aliases: [to_fx, TO_fx, fx_to]
