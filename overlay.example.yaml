# Example overlay: aliases (how users ask) → metric id + warehouse apply_column.
# Methodology texts come from the dbt manifest; this file only adds aliases/columns.

metrics:
  - id: revenue
    apply_column: revenue
    aliases: [Revenue, rev]

  - id: gp
    apply_column: gp
    aliases: [GP]

  - id: gmp
    apply_column: gmp
    aliases: [GMP]

  - id: spend
    apply_column: spend
    aliases: [Spend]

  - id: turnover_fx
    apply_column: fx_to
    aliases: [to_fx, TO_fx, fx_to]
